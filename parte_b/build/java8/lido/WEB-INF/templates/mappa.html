<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Mappa Spiaggia - Lido Sole &amp; Sabbia</title>
  <th:block th:replace="~{fragments/styles :: styles(false)}"></th:block>
</head>

<body>

  <div class="layout-container">
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar('index')}"></div>

    <main class="page-body">
      <div class="table-header">
        <h2 class="ricerca-titolo">Mappa Spiaggia</h2>
      </div>

      <div class="legend">
        <div class="item"><span class="badge free"></span> Disponibile</div>
        <div class="item"><span class="badge reserved"></span> Occupato</div>
        <div class="item"><span class="badge disable"></span> Disabile</div>
      </div>

      <div class="sea">MARE</div>
      <div id="grid"></div>
    </main>

    <div th:replace="~{fragments/reservation_form :: reservation_form}"></div>

    <script th:src="@{/js/reservation_form.js}"></script>
    <script th:src="@{/js/index.js}"></script>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </div>

</body>

</html>
