<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="reservation_form" id="modal-reservation" class="modal">
  <div class="modal-ios">
    <div class="ios-header">
      <div class="ios-umbrella-info">
        <h2 id="display-umbrella-code" class="txt-oro-main">#00</h2>
        <span id="display-umbrella-type" class="txt-tipologia-small txt-grigio-medium">TIPOLOGIA</span>
      </div>
      <span class="close-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </div>

    <form id="form-new-reservation">
      <input type="hidden" id="booking-id" name="id_prenotazione">
      <input type="hidden" id="booking-umbrella-id" name="id_ombrellone">
      <input type="hidden" id="booking-total-cost-hidden" name="prezzo_totale">

      <div class="ios-row-container">
        <div class="ios-date-inputs">
          <div class="ios-date-field">
            <label class="txt-oro-sub-inline">DA:</label>
            <input type="date" name="data_inizio" id="booking-start"
              th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}" required>
          </div>
          <div class="ios-date-field">
            <label class="txt-oro-sub-inline">A: &nbsp;</label>
            <input type="date" name="data_fine" id="booking-end"
              th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}" required>
          </div>
        </div>
        <div class="ios-price-box">
          <span class="txt-grigio-medium-label">COSTO</span>
          <div class="ios-price-value txt-oro-main">
            &euro;<span id="display-total-cost">0</span>
          </div>
        </div>
      </div>

      <hr class="ios-divider">

      <h3 class="txt-oro-sub">Dati Cliente</h3>

      <div class="modal-profile-box">
        <div class="row-fields ios-input-group">
          <div class="field-half">
            <label class="txt-grigio-medium-label" for="client-nome">Nome</label>
            <input type="text" name="nome" id="client-nome" required>
          </div>
          <div class="field-half field-left-border">
            <label class="txt-grigio-medium-label" for="client-cognome">Cognome</label>
            <input type="text" name="cognome" id="client-cognome" required>
          </div>
        </div>

        <div class="ios-input-group">
          <label class="txt-grigio-medium-label" for="client-data-nascita">Data di Nascita</label>
          <input type="date" name="data_nascita" id="client-data-nascita">
        </div>

        <div class="ios-input-group">
          <label class="txt-grigio-medium-label" for="client-indirizzo">Indirizzo casa</label>
          <input type="text" name="indirizzo" id="client-indirizzo">
        </div>

        <div class="row-fields ios-input-group">
          <div class="field-half">
            <label class="txt-grigio-medium-label" for="client-email">Email</label>
            <input type="email" name="email" id="client-email">
          </div>
          <div class="field-half field-left-border">
            <label class="txt-grigio-medium-label" for="client-cellulare">Cellulare</label>
            <input type="tel" name="cellulare" id="client-cellulare">
          </div>
        </div>
      </div>

      <div id="wrapper-creation-actions">
        <button type="submit" class="btn-ios-primary">Conferma Prenotazione</button>
      </div>

      <div id="wrapper-view-actions" style="display: none;">
        <button type="button" class="btn-ios-danger" id="btn-delete-reservation">Elimina Prenotazione</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
