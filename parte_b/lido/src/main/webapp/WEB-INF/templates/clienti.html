<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lido Admin - Clienti</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{css/base.css}">
    <link rel="stylesheet" th:href="@{css/lido_grid.css}">
    <link rel="stylesheet" th:href="@{css/popup.css}">
    <link rel="stylesheet" th:href="@{css/palette_color.css}">
    <link rel="stylesheet" th:href="@{css/responsive.css}">
    <link rel="stylesheet" th:href="@{css/sidebar.css}">
    <link rel="stylesheet" th:href="@{css/tables.css}">
</head>
<body>
  
  <div class="layout-container">
    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar('clienti')}"></div>
    
    <main class="page-body">
      <h1 th:text="${titoloPagina}">Gestione Clienti</h1>
      
      <div class="table-container">
          
          <table>
              <thead>
                  <tr>
                      <th>Codice</th>
                      <th>Nome</th>
                      <th>Cognome</th>
                      <th>Data di Nascita</th>
                      <th>Email</th>
                      <th>Telefono</th>
                      <th>Indirizzo</th>
                  </tr>
              </thead>
              <tbody>
                  <tr th:if="${#lists.isEmpty(clienti)}">
                      <td colspan="7" style="text-align: center; color: #888;">Nessun cliente trovato nel database.</td>
                  </tr>

                  <tr th:each="c : ${clienti}">
                      <td th:text="${c.codice}">000</td>
                      <td th:text="${c.nome}">Mario</td>
                      <td th:text="${c.cognome}">Rossi</td>
                      <td th:text="${c.dataNascita != null ? c.dataNascita : '-'}">01/01/1980</td>
                      <td th:text="${c.email}">mario@example.com</td>
                      <td th:text="${c.telefono}">333 1234567</td>
                      <td th:text="${c.indirizzo}">Via Roma, 1</td>
                  </tr>
              </tbody>
          </table>

      </div>

      <a href="#" class="btn-add">
          <span class="material-symbols-outlined icon">group_add</span> Aggiungi Cliente
      </a>

    </main>

</body>
</html>
