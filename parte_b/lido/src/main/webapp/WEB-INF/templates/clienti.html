<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lido Admin - Clienti</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px;">

    <h1 th:text="${titoloPagina}" style="color: #2c3e50;">Titolo di Default</h1>
    
    <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <p th:text="${messaggio}" style="color: #27ae60; font-weight: bold;">
            Messaggio di default (verrà sovrascritto se funziona)
        </p>
    </div>

    <button style="margin-top: 20px; padding: 10px 15px; background: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer;">
        <span class="material-symbols-outlined" style="vertical-align: middle;">group_add</span> Aggiungi Cliente
    </button>

</body>
</html>
