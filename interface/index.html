<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lido Sole & Sabbia - Prenotazioni</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Piccola aggiunta per gestire i campi data nella sidebar */
    .booking-config {
      margin-top: 15px;
    }

    .booking-config label {
      display: block;
      font-size: 0.85em;
      color: #D4AC0D;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    .booking-config select,
    .booking-config input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .nascosto {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="layout-container">
    <header class="header">
      <h1>Lido Sole & Sabbia</h1>
    </header>

    <aside class="sidebar">
      <nav class="navigazione">
        <h2>Navigazione</h2>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Tariffe</a></li>
          <li>
            <a href="index.html" class="active">Prenota</a>
            <ul class="submenu-prenota">
              <li>
                <label>Tipo:</label>
                <select id="tipo-prenotazione" onchange="cambiaModalitaData()">
                  <option value="giornaliero">Giornaliero</option>
                  <option value="multi">Più giorni</option>
                  <option value="mensile">Mensile</option>
                </select>
              </li>
              <li id="wrapper-data-inizio">
                <label id="label-inizio">Data:</label>
                <input type="date" id="data-inizio" onchange="recuperaOmbrelloni()">
              </li>
              <li id="wrapper-data-fine" class="nascosto">
                <label>Al:</label>
                <input type="date" id="data-fine" onchange="recuperaOmbrelloni()">
              </li>
              <li id="wrapper-mese" class="nascosto">
                <label>Mese:</label>
                <select id="select-mese" onchange="recuperaOmbrelloni()">
                </select>
              </li>
            </ul>
          </li>
          <li><a href="#">Contatti</a></li>
        </ul>
      </nav>
      <hr class="divisore">

      <div class="cerca">
        <h2>Cerca Ombrellone</h2>
        <input type="text" id="search-input" placeholder="Es. Settore A...">
        <button>Cerca</button>
      </div>
    </aside>

    <main class="corpo-pagina">
      <section class="booking-section">
        <h2>Mappa Disponibilità</h2>
        <p>I posti mostrati come disponibili sono liberi per <strong>tutto</strong> il periodo selezionato.</p>

        <div id="area-mappa">
          <div class="legenda">
            <div class="item"><span class="badge libero"></span> Disponibile</div>
            <div class="item"><span class="badge occupato"></span> Occupato</div>
            <div class="item"><span class="badge disabile"></span> Disabili</div>
          </div>

          <div class="spiaggia-container">
            <div class="mare">MARE</div>
            <div id="griglia-spiaggia"></div>
          </div>

          <div id="info-selezione" class="nascosto">
            <div class="card-conferma">
              <h3>Dettaglio Selezione</h3>
              <p id="dettaglio-testo"></p>
              <button class="btn-conferma"
                style="padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold;">Procedi
                al Contratto</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 - Lido Sole & Sabbia</p>
    </footer>
  </div>

  <script>
    const dataInizioInput = document.getElementById('data-inizio');
    const dataFineInput = document.getElementById('data-fine');
    const tipoPrenotazione = document.getElementById('tipo-prenotazione');
    const grigliaSpiaggia = document.getElementById('griglia-spiaggia');
    const infoSelezione = document.getElementById('info-selezione');
    const dettaglioTesto = document.getElementById('dettaglio-testo');

    // Inizializzazione
    dataInizioInput.value = new Date().toISOString().split('T')[0];
    const dataFine = new Date();
    dataFine.setDate(dataFine.getDate() + 1);

    dataFineInput.value = dataFine.toISOString().split('T')[0];

    window.addEventListener('load', recuperaOmbrelloni);

    // Gestione visibilità campi data
    function cambiaModalitaData() {
      const modalita = tipoPrenotazione.value;

      // Reset visibilità
      document.getElementById('wrapper-data-inizio').classList.add('nascosto');
      document.getElementById('wrapper-data-fine').classList.add('nascosto');
      document.getElementById('wrapper-mese').classList.add('nascosto');

      if (modalita === 'giornaliero') {
        document.getElementById('wrapper-data-inizio').classList.remove('nascosto');
        document.getElementById('label-inizio').innerText = "Data:";
      } else if (modalita === 'multi') {
        document.getElementById('wrapper-data-inizio').classList.remove('nascosto');
        document.getElementById('wrapper-data-fine').classList.remove('nascosto');
        document.getElementById('label-inizio').innerText = "Dal:";
      } else if (modalita === 'mensile') {
        document.getElementById('wrapper-mese').classList.remove('nascosto');
      }

      recuperaOmbrelloni();
    }

    function popolaMesi() {
      const selectMese = document.getElementById('select-mese');
      const nomiMesi = [
        "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
        "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"
      ];

      // Otteniamo il mese corrente (0-11) per impostarlo come predefinito
      const meseCorrente = new Date().getMonth();

      nomiMesi.forEach((mese, indice) => {
        const opt = document.createElement('option');
        opt.value = indice + 1; // Valore numerico (1-12)
        opt.textContent = mese;

        // Imposta Luglio (indice 6) o il mese corrente come selezionato
        if (indice === 6) opt.selected = true;

        selectMese.appendChild(opt);
      });
    }

    // Chiama la funzione all'avvio
    popolaMesi();

    async function recuperaOmbrelloni() {
      grigliaSpiaggia.innerHTML = "<p>Caricamento mappa...</p>";
      try {
        const url = "http://treuominiemezzo.altervista.org/php/get_umbrellas.php";
        const risposta = await fetch(url);
        if (!risposta.ok) throw new Error("Errore nel recupero dati");
        const dati = await risposta.json();
        dati.sort((a, b) => a.settore - b.settore || a.numero_fila - b.numero_fila || a.numero_ordine - b.numero_ordine);
        disegnaMappa(dati);
      } catch (err) {
        grigliaSpiaggia.innerHTML = `<p style="color:red">Errore: ${err.message}</p>`;
      }
    }

    function disegnaMappa(ombrelloni) {
      grigliaSpiaggia.innerHTML = "";
      const lettereSettori = { 1: 'A', 2: 'B', 3: 'C', 4: 'D', 5: 'E' };
      const settoriMap = {};

      ombrelloni.forEach(o => {
        if (!settoriMap[o.settore]) settoriMap[o.settore] = [];
        settoriMap[o.settore].push(o);
      });

      Object.keys(settoriMap).sort().forEach(sIdx => {
        const lettera = lettereSettori[sIdx];
        const container = document.createElement('div');
        container.className = 'settore-container';
        container.innerHTML = `<div class="settore-header">SETTORE ${lettera}</div>`;

        const grid = document.createElement('div');
        grid.className = 'spiaggia-grid';

        settoriMap[sIdx].forEach(o => {
          const dot = document.createElement('div');
          dot.className = 'ombrellone';

          const isDisabile =
            (lettera === 'A' && o.numero_fila == 10 && o.numero_ordine == 20) ||
            (lettera === 'B' && o.numero_fila == 10 && o.numero_ordine == 20) ||
            (lettera === 'C' && o.numero_fila == 10 && o.numero_ordine == 20) ||
            (lettera === 'D' && o.numero_fila == 10 && o.numero_ordine == 20) ||
            (lettera === 'E' && o.numero_fila == 10 && o.numero_ordine == 1) ||
            (o.tipologia_nome && o.tipologia_nome.toLowerCase().includes("disabile"));

          if (isDisabile) dot.classList.add('disabile');
          if (o.occupato) dot.classList.add('occupato');

          dot.title = `${lettera}.${o.numero_fila}.${o.numero_ordine}`;

          dot.addEventListener('click', () => {
            if (!dot.classList.contains('occupato')) {
              document.querySelectorAll('.ombrellone').forEach(d => d.classList.remove('selezionato'));
              dot.classList.add('selezionato');
              infoSelezione.classList.remove('nascosto');

              let tipoDaMostrare = o.tipologia_nome || "Base";
              if (sIdx <= 3 && o.numero_fila <= 2) tipoDaMostrare = "VIP (Fronte Mare)";
              if (sIdx >= 4 && o.numero_fila >= 9) tipoDaMostrare = "Gazebo Executive";
              if (isDisabile) tipoDaMostrare = "Posto Riservato Disabili";

              dettaglioTesto.innerHTML = `
                Hai scelto: <strong>${lettera}.${o.numero_fila}.${o.numero_ordine}</strong><br>
                Tipologia: <strong>${tipoDaMostrare}</strong><br>
                Periodo: <strong>${tipoPrenotazione.value.toUpperCase()}</strong>
              `;
            }
          });
          grid.appendChild(dot);
        });
        container.appendChild(grid);
        grigliaSpiaggia.appendChild(container);
      });
    }
  </script>
</body>

</html>
